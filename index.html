if(currentPage==="tests"){m.innerHTML=`<h1>Practice Tests</h1><p class="muted">Short quizzes to review your Python knowledge.</p><div class="grid"><div class="card"><h3>Quick Practice</h3><div class="stat">10</div><p class="muted">questions • demo mode</p><button onclick="startTest()">Start quick test</button></div><div class="card"><h3>Full Practice</h3><div class="stat">30</div><p class="muted">questions • planned assessment</p><button onclick="toast('Full test will be enabled in the next build.')">Coming soon</button></div><div class="card"><h3>Topic completion test</h3><div class="stat">10</div><p class="muted">Easy, medium and hard mix</p><button onclick="toast('Complete a topic to unlock its assessment in the full version.')">View rules</button></div></div><div id="testarea"></div><div class="notice" style="margin-top:18px">A browser-only prototype is not a secure exam system. Reliable proctoring, identity checks, question banks and exam records require server-side implementation.</div>`}

if(currentPage==="daily"){m.innerHTML=`<h1>Daily Python Tasks</h1><p class="muted">A small daily challenge helps build a steady learning habit.</p><div class="card"><span class="badge">TODAY'S TASK • EASY</span><h2>Print a greeting</h2><p>Write a Python statement that prints <code>Hello, learner!</code></p><textarea class="editor" id="dailycode">print("Hello, learner!")</textarea><div class="tabs"><button onclick="checkDaily()">Submit task</button></div><p class="muted">${state.taskDone?"✓ Today's demo task completed.":"Complete this task to earn 10 points."}</p></div>`}
if(currentPage==="friends"){m.innerHTML=`<h1>Friends & Gift Rewards</h1><p class="muted">Send virtual gifts using points you earned through learning.</p><div class="grid"><div class="card"><div class="stat">${state.points}</div><div class="statlabel">Available points</div></div><div class="card"><div class="stat">${state.gifts.length}</div><div class="statlabel">Gifts sent in this browser</div></div><div class="card"><div class="stat">${state.friends.length}</div><div class="statlabel">Demo friends</div></div></div><div class="card" style="margin-top:16px"><h3>Choose a friend</h3><div class="friends">${state.friends.map(f=>`<label class="friend"><input type="radio" name="friend" value="${f}"> ${f}</label>`).join("")}</div><h3 style="margin-top:20px">Choose a virtual gift</h3><select class="field" id="gift"><option value="100">🌟 Star badge — 100 points</option><option value="250">🎨 Profile theme — 250 points</option><option value="500">🏆 Champion avatar — 500 points</option></select><button onclick="sendGift()">Send gift</button><p class="muted" style="margin-top:12px">No real money or physical gifts. Demo gifts are only stored in this browser.</p></div><div class="card" style="margin-top:16px"><h3>Gift history</h3>${state.gifts.length?state.gifts.map(g=>`<p>🎁 Sent ${g.gift} to <b>${g.to}</b> • ${g.cost} points</p>`).join(""):"<p class='muted'>No gifts sent yet.</p>"}</div>`}
if(currentPage==="certs"){m.innerHTML=`<h1>Certificates</h1><p class="muted">Certificates are planned for assessed learning milestones.</p><div class="grid">${["Python Beginner","Python Intermediate","Python Advanced","Complete Python Course","Coding Competition","30-Day Python Challenge"].map((x,i)=>`<div class="card"><div style="font-size:26px">🏅</div><h3>${x}</h3><p class="muted">${i===0?"Complete beginner lessons and pass an assessment.":"Complete the required topics and a verified assessment."}</p><span class="badge">Planned</span></div>`).join("")}</div><div class="notice" style="margin-top:18px">Real certificates need verified student identity, assessment records and a server-generated certificate ID. This demo does not issue official certificates.</div>`}
if(currentPage==="leaderboard"){m.innerHTML=`<h1>Leaderboard</h1><p class="muted">Example leaderboard layout. Real rankings need shared accounts and server-side point validation.</p><div class="card"><div class="videoitem"><b>🥇 PythonStar</b><b>1,250 XP</b></div><div class="videoitem"><b>🥈 CodeNinja</b><b>980 XP</b></div><div class="videoitem"><b>🥉 LogicLearner</b><b>760 XP</b></div><div class="videoitem"><b>You (local demo)</b><b>${state.points} XP</b></div></div>`}
m.insertAdjacentHTML("beforeend",'<div class="footer">Kovidh Practice • Learn consistently. Code confidently. • Prototype edition</div>')}
function openTopic(i){currentTopic=i;selected=null;page("topic")}
function answer(i){selected=i;let s=samples[currentTopic];if(i===s[5]){state.points+=2;toast("+2 points for a correct answer!")}save();renderTopicOnly()}
function renderTopicOnly(){let s=samples[currentTopic],m=document.getElementById("main");let f=m.querySelector("#feedback");if(f)f.textContent=(selected===s[5]?"Correct! ":"Not quite. ")+s[6];m.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;if(i===s[5])b.classList.add("correct");else if(i===selected)b.classList.add("wrong")})}
function nextQuestion(){selected=null;toast("This prototype includes one reviewed starter question per topic.")}
function markDone(){if(!state.done.includes(currentTopic)){state.done.push(currentTopic);state.points+=15;save();toast("Topic marked complete! +15 points")}else toast("Topic already completed.");page("course")}
async function runCode(){let out=document.getElementById("output"),code=document.getElementById("code").value;out.textContent="Loading Python runtime…";try{if(!window.loadPyodide){await new Promise((res,rej)=>{let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";s.onload=res;s.onerror=rej;document.head.append(s)})}let py=await loadPyodide();let lines=[];py.setStdout({batched:x=>lines.push(x)});py.setStderr({batched:x=>lines.push(x)});await py.runPythonAsync(code);out.textContent=lines.join("\\n")||"Program finished (no printed output)."}catch(e){out.textContent="Could not run code: "+e.message+"\\nCheck your code and internet connection."}}
function startTest(){let area=document.getElementById("testarea");let order=[0,2,4,7,10,12,14,18,23,30],idx=0,score=0;function show(){if(idx>=order.length){area.innerHTML=`<div class="card" style="margin-top:16px"><h2>Test complete</h2><div class="stat">${score}/10</div><p>You scored ${score*10}%.</p><button onclick="startTest()">Retake test</button></div>`;if(score>=8){state.points+=20;save();toast("Test passed! +20 points")}return}let s=samples[order[idx]];area.innerHTML=`<div class="card" style="margin-top:16px"><span class="badge">QUESTION ${idx+1}/10</span><h3>${s[0]}</h3>${s.slice(1,5).map((x,i)=>`<button class="option" onclick="window.testAnswer(${i})">${"ABCD"[i]}. ${x}</button>`).join("")}</div>`;window.testAnswer=(i)=>{if(i===s[5])score++;idx++;show()}}show()}
function playGame(name){if(name==="Guess the Number"){let n=Math.floor(Math.random()*5)+1;let g=prompt("Guess a number from 1 to 5");if(Number(g)===n){state.points+=5;save();toast("Correct! +5 points")}else toast("Good try! The number was "+n)}else{let s=samples[Math.floor(Math.random()*samples.length)];let a=prompt(s[0]+"\\nA. "+s[1]+"\\nB. "+s[2]+"\\nC. "+s[3]+"\\nD. "+s[4]+"\\nType A, B, C or D");if(a&&a.toUpperCase()==="ABCD"[s[5]]){state.points+=5;save();toast("Correct! +5 points")}else toast("Good try — keep practising!")}}
function checkDaily(){let c=document.getElementById("dailycode").value.trim();if(c.includes('print("Hello, learner!")')||c.includes("print('Hello, learner!')")){if(!state.taskDone){state.taskDone=true;state.points+=10;save()}toast("Task completed! +10 points")}else toast("Check the print statement and try again.")}
function sendGift(){let f=document.querySelector('input[name="friend"]:checked');if(!f){toast("Choose a friend first.");return}let sel=document.getElementById("gift"),cost=Number(sel.value),gift=sel.options[sel.selectedIndex].text;if(state.points<cost){toast("You need more earned points for this gift.");return}state.points-=cost;state.gifts.unshift({to:f.value,gift,cost});save();toast("Virtual gift sent to "+f.value+"!");render()}
// Best-effort clipboard restrictions for the in-page coding editors.
document.addEventListener("copy", e => { if (e.target && e.target.classList.contains("editor")) e.preventDefault(); });
document.addEventListener("cut", e => { if (e.target && e.target.classList.contains("editor")) e.preventDefault(); });
document.addEventListener("paste", e => { if (e.target && e.target.classList.contains("editor")) e.preventDefault(); });
document.addEventListener("contextmenu", e => { if (e.target && e.target.classList.contains("editor")) e.preventDefault(); });
document.addEventListener("keydown", e => {
  if (e.target && e.target.classList.contains("editor") && (e.ctrlKey || e.metaKey) && ["c","v","x"].includes(e.key.toLowerCase())) e.preventDefault();
});
save();render();
</script>
</body></html>
